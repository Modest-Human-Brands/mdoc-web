worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location = /config.js {
            add_header Cache-Control "no-store";
            try_files $uri =404;
    }

    # Hashed build files never change, so they can be cached for good.
    location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
    }

    # index.html and the SPA fallback must be revalidated, or a returning visitor keeps an old
    # build that still points at the previous routing and Setup behaviour.
    location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
    }
  }
}